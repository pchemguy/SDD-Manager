interface:
  display_name: "SDD Implementation"
  short_description: "Implement task ranges with verification, commits, and pushes"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"
  brand_color: "#4C6085"
  default_prompt: "Use $sdd-implement to push outstanding commits first, execute or resume the selected TASKS or FEATURE-TASKS range, verify and document each task, commit and push its result, and stop at the requested checkpoint."
policy:
  allow_implicit_invocation: true
