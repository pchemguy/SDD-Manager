name: Windows shell contracts
on:
  push:
    paths:
      - '.agents/plugins/sdd-manager/assets/WINDOWS_SHELL_POLICY.md'
      - 'tests/test_windows_shell_recovery.py'
      - '.github/workflows/windows-shell-recovery.yml'
  pull_request:
    paths:
      - '.agents/plugins/sdd-manager/assets/WINDOWS_SHELL_POLICY.md'
      - 'tests/test_windows_shell_recovery.py'
      - '.github/workflows/windows-shell-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cmd:
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Exercise the standalone policy's batch adapter with CMD
        shell: cmd
        run: python -m unittest discover -s tests -p test_windows_shell_recovery.py -v
