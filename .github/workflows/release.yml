name: Release plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check release metadata
        run: |
          python - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("plugin.json").read_text())
          version = manifest["version"]
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit("Tag does not match manifest version")
          PYCODE

      - name: Run support tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover \
            -s acceptance/textstats/tests \
            -t acceptance/textstats -v

      - name: Build package and checksum
        run: |
          package="sdd-manager.zip"
          git archive \
            --format=zip \
            --prefix=sdd-manager/ \
            --output="$package" \
            HEAD \
            assets skills \
            LICENSE plugin.json README.md AGENTS.md \
            SDD-MANAGER.md AI_DISCLOSURE.md
          sha256sum "$package" > "$package.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          package="sdd-manager.zip"
          gh release create "$GITHUB_REF_NAME" \
            "$package" "$package.sha256" \
            --verify-tag \
            --generate-notes \
            --title "SDD Manager ${GITHUB_REF_NAME}"
